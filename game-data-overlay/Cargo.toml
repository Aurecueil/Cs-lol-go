[package]
name = "game-data-overlay"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
camino = { version = "1", features = ["serde1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ltk_meta = "=0.9.0"
ltk_wad = "0.5.9"
ltk_game_data = { git = "https://github.com/LeagueToolkit/league-mod", rev = "71ba1f0d1487f68e963bb3d7231455d9052f662c" }
ltk_game_index = { git = "https://github.com/LeagueToolkit/league-mod", rev = "71ba1f0d1487f68e963bb3d7231455d9052f662c" }
ltk_mod_project = { git = "https://github.com/LeagueToolkit/league-mod", rev = "71ba1f0d1487f68e963bb3d7231455d9052f662c" }
ltk_overlay = { git = "https://github.com/LeagueToolkit/league-mod", rev = "71ba1f0d1487f68e963bb3d7231455d9052f662c" }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
